<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../src/particles/particles.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="staff-styles.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../src/img/genshin-impact-emote.gif"
    />
    <title>osu! Tournaments</title>
  </head>
  <body>
    <div id="particles-js" class="particles-js"></div>

    <div class="content">
      <div class="tournaments-list-section">
        <h1 class="section_title">Staff history</h1>
        <p class="tournaments-subtitle">
          Here you can see what tournaments I've worked on as staff and check
          out my roles at those tournaments
        </p>

        <div class="controls-wrapper">
          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="Search tournament, host or role..."
            />
          </div>

          <div class="filters-row">
            <select id="statusFilter" class="filter-select">
              <option value="all">All Statuses</option>
              <option value="ongoing">Ongoing</option>
              <option value="upcoming">Upcoming</option>
              <option value="completed">Completed</option>
            </select>

            <select id="roleFilter" class="filter-select">
              <option value="all">All Roles</option>
              <option value="streamer">Streamer</option>
              <option value="caster">Caster</option>
              <option value="referee">Referee</option>
              <option value="restreamer">Restreamer</option>
              <option value="gfx">GFX</option>
              <option value="developer">Developer</option>
              <option value="admin">Admin</option>
            </select>

            <select id="typeFilter" class="filter-select">
              <option value="all">All Types</option>
              <option value="Standard">Standard</option>
              <option value="Draft">Draft</option>
              <option value="Auction">Auction</option>
            </select>

            <select id="badgeFilter" class="filter-select">
              <option value="all">Badge and no badge</option>
              <option value="badged">Badged Only</option>
              <option value="nobadge">No Badge Only</option>
            </select>

            <select id="yearFilter" class="filter-select">
              <option value="all">All Years</option>
              <option value="2026">2026</option>
              <option value="2025">2025</option>
              <option value="2024">2024</option>
            </select>

            <select id="sortOrder" class="filter-select">
              <option value="desc">Newest First</option>
              <option value="asc">Oldest First</option>
            </select>
          </div>
        </div>

        <div class="pagination-container" id="paginationTop"></div>

        <div class="tournament-cards-container" id="cardsContainer"></div>

        <div class="pagination-container" id="paginationBottom"></div>

        <div class="back-link-container">
          <a href="../index.html" class="back-link">
            <img
              src="../src/icons/home-blue.svg"
              alt="Home Icon"
              class="link-icon"
            />
            Back to Home
          </a>
        </div>
      </div>
    </div>

    <script src="../src/particles/particles.min.js"></script>
    <script src="../src/particles/particles.js"></script>
    <script src="staff-scripts.js"></script>
  </body>
</html>
